services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bazhov-api
    ports:
      - ${API_PORT}:${API_PORT}
    environment:
      # ---- app ----
      SITE_URL: "http://localhost:${API_PORT}"
      API_KEY: ${API_KEY}

      # ---- storage ----
      STORAGE_PATH: "/app/${STORAGE}"

      # ---- db ----
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_TYPE: ${DB_TYPE}
    volumes:
      - storage:/app/${STORAGE}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: bazhov-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "bazhov_dictionary"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  storage: